name: AIS RX experimental build — Dr. Heinz Doofenshmirtz

on:
  push:
    branches: [ ais-rx ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run AIS post-demodulator host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iapp \
             app/ais_bits.c utils/ais_bits_test.c -o /tmp/ais_bits_test
          /tmp/ais_bits_test
      - name: Test synthetic 9.6-kbaud AIS discriminator-audio receiver
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iapp \
             app/ais_bits.c utils/ais_af_decode.c utils/ais_af_test.c \
             -lm -o /tmp/ais_af_test
          /tmp/ais_af_test
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iapp \
             app/ais_bits.c utils/ais_af_decode.c utils/ais_af_wav.c \
             -lm -o /tmp/ais_af_wav
          /tmp/ais_af_test --wav /tmp/ais_af_valid.wav
          /tmp/ais_af_wav /tmp/ais_af_valid.wav | tee /tmp/ais_af_valid.log
          grep -q 'AIS CRC OK: type=1 MMSI=123456789' /tmp/ais_af_valid.log
          /tmp/ais_af_test --noise /tmp/ais_af_noise.wav
          /tmp/ais_af_wav /tmp/ais_af_noise.wav | tee /tmp/ais_af_noise.log
          grep -q 'CRC valid=0' /tmp/ais_af_noise.log
      - name: Test standalone on-radio RF pulse diagnostic
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iapp \
             app/ais_diag_core.c utils/ais_diag_test.c \
             -o /tmp/ais_diag_test
          /tmp/ais_diag_test
      - name: Check AIS Docker helper shell syntax
        run: sh -n compile-with-docker.sh
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '10.3-2021.10'
      - name: Build both RX-only AF routes for hardware comparison
        run: |
          set -eu
          mkdir -p out
          make clean
          make -j"$(nproc)" ENABLE_AIS_RX=1 AIS_AF_ROUTE=9
          cp f4hwn.bin out/ais-rx-af9-digital-bypass.bin
          make clean
          make -j"$(nproc)" ENABLE_AIS_RX=1 AIS_AF_ROUTE=1
          cp f4hwn.bin out/ais-rx-af1-fm-audio.bin
          for file in out/*.bin; do
            size=$(stat -c%s "$file")
            echo "$(basename "$file"): $size / 61440 bytes"
            test "$size" -le 61440
          done
      - uses: actions/upload-artifact@v4
        with:
          name: AIS-RX-AF9-AF1-EXPERIMENTAL
          path: out/*.bin
          retention-days: 7
